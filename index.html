<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karınca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #f8f4ec 0%, #e8e0d0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            color: #2c2c2c;
        }

        #puan {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        #yuksek {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .karinca {
            font-size: 7rem;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.12));
            margin-bottom: 35px;
        }

        .karinca.donuyor {
            transform: rotate(360deg);
        }

        .karinca:active {
            transform: scale(0.92);
        }

        #isim-alani {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            align-items: center;
        }

        #isim-input {
            padding: 9px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            width: 150px;
            outline: none;
            background: white;
        }

        #isim-input:focus {
            border-color: #888;
        }

        #kaydet-btn {
            padding: 9px 18px;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }

        #kaydet-btn:hover {
            background: #444;
        }

        #kaydet-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #top-list {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px 26px;
            min-width: 260px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        #top-list h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #444;
            text-align: center;
        }

        #top-list ol {
            list-style: none;
            counter-reset: rank;
        }

        #top-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        #top-list li:last-child {
            border-bottom: none;
        }

        #top-list li::before {
            counter-increment: rank;
            content: counter(rank);
            font-weight: 600;
            color: #888;
            margin-right: 12px;
            min-width: 18px;
        }

        .isim {
            color: #444;
            flex: 1;
            text-align: left;
            margin-right: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .skor {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .bilgi {
            font-size: 0.78rem;
            color: #999;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="puan">0</div>
    <div id="yuksek">En Yüksek: 0</div>

    <div class="karinca" id="karinca">🐜</div>

    <div id="isim-alani">
        <input type="text" id="isim-input" placeholder="İsmin yaz" maxlength="14">
        <button id="kaydet-btn">Skoru Kaydet</button>
    </div>

    <div id="top-list">
        <h3>Global Top List</h3>
        <ol id="liste">
            <li style="justify-content:center;color:#999;font-size:0.95rem">Yükleniyor...</li>
        </ol>
        <div class="bilgi">Skorlar bu cihazda kalıcıdır</div>
    </div>

    <script>
        let puan = 0;
        let enYuksek = parseInt(localStorage.getItem('karincaEnYuksek')) || 0;
        let kayitliIsim = localStorage.getItem('karincaIsim') || "";

        const puanEl = document.getElementById('puan');
        const yuksekEl = document.getElementById('yuksek');
        const karinca = document.getElementById('karinca');
        const listeEl = document.getElementById('liste');
        const isimInput = document.getElementById('isim-input');
        const kaydetBtn = document.getElementById('kaydet-btn');

        yuksekEl.textContent = `En Yüksek: ${enYuksek}`;
        if (kayitliIsim) isimInput.value = kayitliIsim;

        // Karıncaya tıkla
        karinca.addEventListener('click', () => {
            puan++;
            puanEl.textContent = puan;

            karinca.classList.remove('donuyor');
            void karinca.offsetWidth;
            karinca.classList.add('donuyor');

            if (puan > enYuksek) {
                enYuksek = puan;
                localStorage.setItem('karincaEnYuksek', enYuksek);
                yuksekEl.textContent = `En Yüksek: ${enYuksek}`;
            }
        });

        // Skor kaydet
        kaydetBtn.addEventListener('click', () => {
            const isim = isimInput.value.trim();
            if (!isim) {
                alert("İsim yaz lütfen 🐜");
                return;
            }
            if (puan < 1) {
                alert("Önce karıncaya tıkla!");
                return;
            }

            localStorage.setItem('karincaIsim', isim);

            let topList = JSON.parse(localStorage.getItem('karincaGlobalTop')) || [];

            // Aynı isim varsa daha yüksek skoru tut
            const index = topList.findIndex(x => x.isim.toLowerCase() === isim.toLowerCase());
            if (index >= 0) {
                if (puan > topList[index].skor) {
                    topList[index].skor = puan;
                }
            } else {
                topList.push({ isim: isim, skor: puan });
            }

            // Sırala ve top 10'a düşür
            topList.sort((a, b) => b.skor - a.skor);
            topList = topList.slice(0, 10);

            localStorage.setItem('karincaGlobalTop', JSON.stringify(topList));
            guncelleListe();

            // Küçük feedback
            kaydetBtn.textContent = "Kaydedildi ✓";
            setTimeout(() => {
                kaydetBtn.textContent = "Skoru Kaydet";
            }, 1500);
        });

        function guncelleListe() {
            let topList = JSON.parse(localStorage.getItem('karincaGlobalTop')) || [];

            if (topList.length === 0) {
                listeEl.innerHTML = '<li style="justify-content:center;color:#999;font-size:0.95rem">Henüz kimse yok</li>';
                return;
            }

            listeEl.innerHTML = topList.map(item => `
                <li>
                    <span class="isim">${item.isim}</span>
                    <span class="skor">${item.skor}</span>
                </li>
            `).join('');
        }

        // Sayfa açılınca listeyi göster
        guncelleListe();
    </script>
</body>
</html>
